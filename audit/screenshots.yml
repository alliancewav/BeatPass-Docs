version: 3
current_manifest: audit/media-catalog.json
first_pass_manifest: audit/screenshots.json
historical_manifest: audit/screenshots-2026-08-11.yml
policy:
  customer_data: prohibited
  capture: current-source synthetic preview only; stage outside public assets
  provenance: source and public-theme fingerprints, route, state, viewport, date, font and PNG hashes
  review: inspect every variant before promotion
  coverage: desktop/mobile and light/dark required for every current figure
  publication: local unpublished review; complete matching app verification first
  historical_assets: retain existing public URLs; do not treat old captures as current evidence
